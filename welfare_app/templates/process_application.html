<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process & Complete Application - Akshaya Assist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white p-3 rounded-top-4">
                    <h4 class="mb-0">Process Application #{{ app.id }}</h4>
                </div>
                <div class="card-body p-4">
                    
                    <!-- Form Starts Here -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- SECTION 1: Akshaya Staff Filling Details -->
                        <h5 class="text-primary border-bottom pb-2 mb-3">1. Application & Applicant Details</h5>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Full Name of Applicant</label>
                                <input type="text" name="applicant_name" class="form-control" value="{{ app.applicant_name|default:'' }}" required placeholder="Enter applicant name">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Aadhaar / ID Number</label>
                                <input type="text" name="id_number" class="form-control" value="{{ app.id_number|default:'' }}" required placeholder="Enter Aadhaar or ID No.">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Annual Income (₹)</label>
                                <input type="number" name="income" class="form-control" value="{{ app.income|default:'' }}" placeholder="Enter annual income">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Upload Supporting Document (Optional)</label>
                                <input type="file" name="document" class="form-control">
                                {% if app.document %}
                                    <small class="text-muted">Current file: <a href="{{ app.document.url }}" target="_blank">View Document</a></small>
                                {% endif %}
                            </div>
                        </div>

                        <!-- SECTION 2: Staff Processing & Status -->
                        <h5 class="text-primary border-bottom pb-2 mt-4 mb-3">2. Processing Action</h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-bold">Application Status</label>
                                <select name="status" id="status" class="form-select" required>
                                    <option value="Pending" {% if app.status == 'Pending' %}selected{% endif %}>Pending</option>
                                    <option value="Approved" {% if app.status == 'Approved' %}selected{% endif %}>Approved / Completed</option>
                                    <option value="Rejected" {% if app.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label for="remarks" class="form-label fw-bold">Remarks / Internal Notes</label>
                                <textarea name="remarks" id="remarks" class="form-control" rows="3" placeholder="Add any details, instructions or reason for rejection...">{{ app.remarks|default:'' }}</textarea>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                            <a href="{% url 'staff_dashboard' %}" class="btn btn-outline-secondary px-4 rounded-pill">Back to Dashboard</a>
                            <button type="submit" class="btn btn-success px-5 rounded-pill">Save & Update Application</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
