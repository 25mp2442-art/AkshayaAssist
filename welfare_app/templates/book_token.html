{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4>Book Appointment & Token</h4>
        </div>
        <div class="card-body">
            <p><strong>Application ID:</strong> {{ app.application_id }}</p>
            <p><strong>Scheme:</strong> {{ app.scheme.title }}</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Select Visit Date</label>
                    <input type="date" name="appointment_date" class="form-control" required min="{{ today }}">
                </div>
                <button type="submit" class="btn btn-success w-100">Confirm & Get Token Number</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
