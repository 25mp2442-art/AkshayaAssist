{% extends 'base.html' %}

{% block title %}Login - Akshaya Portal{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 420px; width: 100%;">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="fa-solid fa-circle-user text-primary fa-3x mb-2"></i>
                <h3 class="fw-bold text-dark">AkshayaAssist</h3>
                <p class="text-muted small">Login to your account</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg rounded-3 fs-6" placeholder="Enter username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg rounded-3 fs-6" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold mt-2 shadow-sm">
                    Login
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
