<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile | AkshayaAssist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="fw-bold text-primary mb-2">Complete Profile</h3>
                    <p class="text-muted small mb-4">Provide your details to check Government Scheme eligibility.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Age</label>
                            {{ form.age }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Annual Income (in ₹)</label>
                            {{ form.annual_income }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ration Card Category</label>
                            {{ form.ration_card_type }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Social Category</label>
                            {{ form.category }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Occupation</label>
                            {{ form.occupation }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-3 rounded-3 fw-bold">Save & Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
