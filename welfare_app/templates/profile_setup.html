<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup - AkshayaAssist</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Update Profile Information</h4>
                </div>
                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Age -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Age</label>
                            <input type="number" name="age" class="form-control" value="{{ profile.age|default:'' }}" placeholder="Enter your age" required>
                        </div>

                        <!-- Annual Income -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Annual Income (₹)</label>
                            <input type="number" step="0.01" name="annual_income" class="form-control" value="{{ profile.annual_income|default:'' }}" placeholder="Enter annual income" required>
                        </div>

                        <!-- Ration Card Category -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ration Card Type</label>
                            <select name="ration_card_type" class="form-select" required>
                                <option value="">Select Ration Card Category</option>
                                <option value="APL" {% if profile.ration_card_type == 'APL' %}selected{% endif %}>APL (Blue/White Card)</option>
                                <option value="BPL" {% if profile.ration_card_type == 'BPL' %}selected{% endif %}>BPL (Yellow/Pink Card)</option>
                            </select>
                        </div>

                        <!-- Social Category -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Social Category</label>
                            <select name="category" class="form-select" required>
                                <option value="">Select Category</option>
                                <option value="General" {% if profile.category == 'General' %}selected{% endif %}>General</option>
                                <option value="OBC" {% if profile.category == 'OBC' %}selected{% endif %}>OBC</option>
                                <option value="SC" {% if profile.category == 'SC' %}selected{% endif %}>SC</option>
                                <option value="ST" {% if profile.category == 'ST' %}selected{% endif %}>ST</option>
                            </select>
                        </div>

                        <!-- Gender -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Gender</label>
                            <select name="gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if profile.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <!-- Occupation -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Occupation</label>
                            <input type="text" name="occupation" class="form-control" value="{{ profile.occupation|default:'' }}" placeholder="Enter your occupation" required>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Save Profile & Continue</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
